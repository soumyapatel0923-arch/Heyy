<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Note</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Poppins', sans-serif;
    }

    body {
      background: #ffe6eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
      position: relative;
      transition: all 0.3s ease;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .screen.active {
      display: flex;
    }

    h2, h3 {
      color: #ff4b72;
    }

    img.sticker {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 15px;
    }

    input[type="number"] {
      padding: 10px 15px;
      font-size: 18px;
      border: 2px solid #ff4b72;
      border-radius: 10px;
      width: 120px;
      text-align: center;
      outline: none;
    }

    button {
      background: #ff4b72;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: #e03e61;
      transform: scale(1.05);
    }

    /* Dodgers container for Screen 3 */
    .button-group {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      position: relative;
      width: 100%;
      height: 100px;
      justify-content: center;
      align-items: center;
    }

    #no-btn {
      position: absolute;
      transition: top 0.2s ease, left 0.2s ease;
    }

    /* Screen 4 background style */
    .packing-bg {
      background: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1M3N3Yndndm4zOHBhZGsxd3I0OGFwa3IxdDkxaWhxNG13ZHBzNSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKSjRrfIPjeiVyM/giphy.gif') center/cover no-repeat;
      border-radius: 20px;
      padding: 20px;
      color: white;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">

    <!-- SCREEN 1: Busy -->
    <div class="screen active" id="screen1">
      <h2>Busy... 📱</h2>
      <img class="sticker" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMzByZDRscXF2MG4zcmIzaXZsbHZkOHZ2dXd3a3Ezb2RmMTh3cDRrayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L9523421uJqq/giphy.gif" alt="Busy sticker">
      <button onclick="nextScreen(2)">Continue 💕</button>
    </div>

    <!-- SCREEN 2: Math Puzzle -->
    <div class="screen" id="screen2">
      <h2>Chalo, give me a sum of:</h2>
      <h3>100 + 55</h3>
      <input type="number" id="math-input" placeholder="?" oninput="checkMath()">
      
      <div id="math-result" style="display:none; flex-direction:column; align-items:center; gap:10px;">
        <h2 id="result-text" style="color: #d63384;"></h2>
        <img class="sticker" src="https://media.giphy.com/media/d22UJ4XYBf45O/giphy.gif" alt="Sad sticker">
        <button onclick="nextScreen(3)">Next 🥺</button>
      </div>
    </div>

    <!-- SCREEN 3: Missing Me & Dodging No -->
    <div class="screen" id="screen3">
      <h2>Missing me...? 🥺</h2>
      <h3 id="yes-response" style="display:none; color: #ff4b72; margin-top: 10px;">Ohh yesss!! ❤️</h3>
      
      <div class="button-group" id="btn-group">
        <button id="yes-btn" onclick="handleYes()">Yes! 🥰</button>
        <button id="no-btn" onmouseover="dodgeNo()" onclick="dodgeNo()">No 😜</button>
      </div>
    </div>

    <!-- SCREEN 4: Packing & Headpat -->
    <div class="screen" id="screen4">
      <div class="packing-bg">
        <h2 style="color: #fff;">Packing done... tired... 🧳😴</h2>
      </div>
      <h3 style="margin-top: 15px;">Chalo do packing and say...</h3>
      <img class="sticker" src="https://media.giphy.com/media/ARSp9T7wwxNcs/giphy.gif" alt="Head pat GIF">
    </div>

  </div>

  <script>
    function nextScreen(screenNumber) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`screen${screenNumber}`).classList.add('active');
    }

    // Math Check Function
    function checkMath() {
      const val = document.getElementById('math-input').value;
      if (val === '155') {
        document.getElementById('math-input').style.display = 'none';
        const resultDiv = document.getElementById('math-result');
        const resultText = document.getElementById('result-text');
        
        resultText.innerText = "M" + val + " iss you! 🥺";
        resultDiv.style.display = 'flex';
      }
    }

    // Dodging No Button
    function dodgeNo() {
      const noBtn = document.getElementById('no-btn');
      const container = document.getElementById('btn-group');
      
      const containerRect = container.getBoundingClientRect();
      
      // Calculate random downwards/out-of-reach positions
      const newTop = Math.floor(Math.random() * 120) + 40; 
      const newLeft = Math.floor(Math.random() * (containerRect.width - 60));

      noBtn.style.top = `${newTop}px`;
      noBtn.style.left = `${newLeft}px`;
    }

    // Handle Yes Click
    function handleYes() {
      document.getElementById('yes-response').style.display = 'block';
      setTimeout(() => {
        nextScreen(4);
      }, 1500);
    }
  </script>
</body>
</html>
